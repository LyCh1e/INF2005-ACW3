# Vulnerable lab environment for ACW3 (Group P1-6).
# Targets three CVEs against Apache HTTP Server 2.4.68 (fixed in 2.4.69):
#   - CVE-2026-93546 mod_dav_fs   (WebDAV PROPPATCH namespace overflow)
#   - CVE-2026-73636 mod_auth_digest (digest nonce replay, needs AuthDigestNonceLifetime 0)
#   - CVE-2026-63686 mod_xml2enc (NULL pointer deref via proxied charset conversion)
#
# DO NOT expose these ports beyond your own isolated pentest network/VM.

services:
  target:
    image: httpd:2.4.68
    container_name: acw3-target
    ports:
      - "8080:80"
    # Memory cap so the CVE-2026-93546 PROPPATCH namespace-overflow PoC kills the
    # worker fast and SAFELY: a crafted request amplifies ~1 MB of XML into
    # multiple GB in the worker. Without a cap it can exhaust the host's RAM
    # (observed >10 GB) before anything crashes. Capping the container at 512 MB
    # (no swap) makes the worker hit the limit and die within seconds, the DoS is
    # clearly demonstrable, and your laptop stays safe. This models a real server
    # with finite RAM; it does not change whether the bug is present.
    mem_limit: 512m
    memswap_limit: 512m
    volumes:
      - ./conf/httpd-vuln.conf:/usr/local/apache2/conf/extra/httpd-vuln.conf:ro
      - ./conf/digest.passwd:/usr/local/apache2/conf/digest.passwd:ro
      - ./conf/davlock:/usr/local/apache2/davlock:rw
      - ./public:/usr/local/apache2/htdocs:ro
      - ./www:/usr/local/apache2/htdocs/dav:rw
    command: >
      sh -c "
      grep -qxF 'Include conf/extra/httpd-vuln.conf' /usr/local/apache2/conf/httpd.conf ||
      echo 'Include conf/extra/httpd-vuln.conf' >> /usr/local/apache2/conf/httpd.conf &&
      httpd-foreground
      "
    networks:
      - labnet

  backend:
    build: ./backend
    container_name: acw3-backend
    networks:
      - labnet
    # Not published externally; reached only via the target's reverse proxy
    # so the mod_xml2enc CVE is triggered through a proxied response.

networks:
  labnet:
    driver: bridge
