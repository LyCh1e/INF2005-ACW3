# Additional config loaded on top of the default httpd.conf (2.4.68).
# Enables the three modules targeted for ACW3 and mirrors the vulnerable
# configuration described in each CVE record, for use in an isolated lab.

ServerName localhost

# ---------------------------------------------------------------------------
# DEMO-ONLY worker cap (Option B: make the CVE-2026-93546 DoS visible).
# The stock image runs the event MPM with ~400 worker threads, so killing /
# loading a few workers never affects availability. Pinning the server to a
# tiny worker pool models a small production server: a handful of concurrent
# expensive PROPPATCH requests then occupy every worker (and OOM-kill the sole
# child), so legitimate requests to /dav/ visibly hang/time out during a flood
# and recover when it stops. This does NOT change whether the bug exists; it
# only shrinks capacity so the denial-of-service is demonstrable in a browser.
# To revert to the realistic large pool, delete this block and recreate the
# target container.
<IfModule mpm_event_module>
    ServerLimit            1
    StartServers           1
    ThreadLimit            2
    ThreadsPerChild        2
    MaxRequestWorkers      2
    MinSpareThreads        1
    MaxSpareThreads        2
    MaxConnectionsPerChild 0
</IfModule>

# --- Modules needed ---
LoadModule dav_module modules/mod_dav.so
LoadModule dav_fs_module modules/mod_dav_fs.so
LoadModule auth_digest_module modules/mod_auth_digest.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule proxy_html_module modules/mod_proxy_html.so
LoadModule xml2enc_module modules/mod_xml2enc.so

# ---------------------------------------------------------------------------
# CVE-2026-93546 - mod_dav_fs namespace overflow (High, 8.8)
# Precondition per the CVE record: an authenticated WebDAV client with
# write access. /dav below is writable by the digest-auth user "labuser".
# ---------------------------------------------------------------------------
DavLockDB "/usr/local/apache2/davlock/DavLock"

<Directory "/usr/local/apache2/htdocs/dav">
    Dav On
    Options Indexes

    # --- Directory-listing styling only (cosmetic; does NOT change the
    #     WebDAV / digest / CVE behaviour below). Renders the shared-drive
    #     index with the Fieldstone look via a custom header + stylesheet. ---
    IndexOptions FancyIndexing HTMLTable SuppressIcon SuppressColumnSorting SuppressDescription SuppressHTMLPreamble NameWidth=*
    HeaderName "/dav-assets/header.html"
    ReadmeName "/dav-assets/footer.html"

    AuthType Digest
    AuthName "acw3-dav"
    AuthDigestProvider file
    AuthUserFile "/usr/local/apache2/conf/digest.passwd"
    Require valid-user

    # ---------------------------------------------------------------------
    # CVE-2026-73636 - mod_auth_digest nonce replay (High, 8.1)
    # Precondition per the CVE record: AuthDigestNonceLifetime set to 0.
    # Only valid inside a Directory/Location block, not server-wide.
    # ---------------------------------------------------------------------
    AuthDigestNonceLifetime 0

    LimitXMLRequestBody 0
</Directory>

# ---------------------------------------------------------------------------
# CVE-2026-63686 - mod_xml2enc NULL pointer dereference (High, 7.5)
# Precondition per the CVE record: a reverse-proxied backend response whose
# charset conversion partially succeeds then fails. /proxy forwards to the
# "backend" container, which serves the crafted response for this purpose.
# ---------------------------------------------------------------------------
ProxyRequests Off
ProxyPreserveHost On

<Location "/proxy">
    ProxyPass "http://backend:5000/"
    ProxyPassReverse "http://backend:5000/"
    SetOutputFilter proxy-html
    ProxyHTMLEnable On
    ProxyHTMLCharsetOut *
</Location>
