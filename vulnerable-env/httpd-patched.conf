# PATCHED configuration — all three CVE mitigations applied.
# Compare with httpd-vuln.conf to see what changed.
#
# How to use:
#   docker compose -f docker-compose-patched.yml up -d
#   (then re-run the same exploit scripts — they should all FAIL)

ServerName localhost

# --- Modules needed (xml2enc REMOVED as mitigation for CVE-2026-63686) ---
LoadModule dav_module modules/mod_dav.so
LoadModule dav_fs_module modules/mod_dav_fs.so
LoadModule auth_digest_module modules/mod_auth_digest.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
# LoadModule proxy_html_module modules/mod_proxy_html.so    # REMOVED — CVE-2026-63686 mitigation
# LoadModule xml2enc_module modules/mod_xml2enc.so          # REMOVED — CVE-2026-63686 mitigation

# ---------------------------------------------------------------------------
# CVE-2026-93546 MITIGATION: LimitXMLRequestBody 102400
# The default is 1,000,000 bytes (1 MB), which is large enough for the
# ~0.8 MB attack payload. Lowering it to 100 KB causes Apache to reject
# the oversized PROPPATCH with 413 Request Entity Too Large BEFORE parsing.
# ---------------------------------------------------------------------------
DavLockDB "/usr/local/apache2/davlock/DavLock"

<Directory "/usr/local/apache2/htdocs/dav">
    Dav On
    Options Indexes

    # --- CVE-2026-93546 MITIGATION ---
    LimitXMLRequestBody 102400

    IndexOptions FancyIndexing HTMLTable SuppressIcon SuppressColumnSorting SuppressDescription SuppressHTMLPreamble NameWidth=*
    HeaderName "/dav-assets/header.html"
    ReadmeName "/dav-assets/footer.html"

    AuthType Digest
    AuthName "acw3-dav"
    AuthDigestProvider file
    AuthUserFile "/usr/local/apache2/conf/digest.passwd"
    Require valid-user

    # --- CVE-2026-73636 MITIGATION ---
    # Changed from 0 (never expire) to 60 seconds.
    # After 60 seconds the nonce expires and any replay returns 401.
    AuthDigestNonceLifetime 60
</Directory>

# ---------------------------------------------------------------------------
# CVE-2026-63686 MITIGATION: proxy still works, but without the
# xml2enc/proxy-html filter chain that caused the NULL dereference.
# Requests to /proxy/ are proxied normally — just no charset conversion.
# ---------------------------------------------------------------------------
ProxyRequests Off
ProxyPreserveHost On

<Location "/proxy">
    ProxyPass "http://backend:5000/"
    ProxyPassReverse "http://backend:5000/"
    # SetOutputFilter proxy-html        # REMOVED
    # ProxyHTMLEnable On                # REMOVED
    # ProxyHTMLCharsetOut *             # REMOVED
</Location>
